# edgevision.service 的 drop-in：把网关从 cam1 切到 cam2
#
# 为什么有这个文件（2026-11-11）：
#   原 unit 的 ExecStart 写死 /dev/video81（cam1），该设备当天实测硬件损坏——
#   空闲状态下 v4l2-ctl 抓帧恒 0 字节（4 种格式组合全试过），而 cam2 同命令
#   能出 245~300 KB。软件复位（authorized 0/1 重插、uvcvideo unbind/bind）全部无效。
#   详见 docs/TROUBLESHOOTING.md 第 54 条「复位有效性实测」。
#
#   不切 cam2 的话，网关会 active 但一帧都推不出来：
#   journal 每秒刷 `VIDEOIO(V4L2:/dev/video81): select() timeout`，
#   上位机连 9000 收不到任何数据 —— 这是最容易被骗的「服务正常、功能全死」状态。
#
# 装上：
#   sudo mkdir -p /etc/systemd/system/edgevision.service.d
#   sudo cp lab/services/edgevision-cam2.conf \
#           /etc/systemd/system/edgevision.service.d/cam2.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart edgevision
#
# 撤销（换回 cam1 / 修好硬件之后）：
#   sudo rm /etc/systemd/system/edgevision.service.d/cam2.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart edgevision
#
# 注意：`ExecStart=` 空赋值是必需的。systemd 对同一指令是"追加"语义，
#      不先清空的话会变成两个 ExecStart 并存，启动直接失败。

[Service]
ExecStart=
ExecStart=/root/lab/w4_edgevision_gateway /dev/video83

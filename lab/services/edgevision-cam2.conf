# ⚠️ 本文件已废弃（2026-11-19），保留仅为兼容旧部署脚本。
#
# 为什么废弃：
#   edgevision.service 现在通过 EnvironmentFile=/etc/default/edgevision 的
#   $GATEWAY_CAM 决定摄像头，不再把设备节点写死在 ExecStart 里。
#   再用 drop-in 覆盖 ExecStart 会造成**两处都能改摄像头** ——
#   正是本项目反复踩过的「同一件事存两处，迟早有一处是错的」。
#
# 换摄像头请改这一个地方：
#   sudo sed -i 's|^GATEWAY_CAM=.*|GATEWAY_CAM=/dev/video83|' /etc/default/edgevision
#   sudo systemctl restart edgevision
#
# 若这个 drop-in 还装在板上（/etc/systemd/system/edgevision.service.d/cam2.conf），
# 请删掉它，否则它会覆盖掉 $GATEWAY_CAM 的取值：
#   sudo rm /etc/systemd/system/edgevision.service.d/cam2.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart edgevision
#
# 原始背景（cam1 于 2026-11-11 实测硬件损坏，空闲态抓帧恒 0 字节，
# 而 cam2 能出 245~300 KB；软件复位全部无效）见 docs/TROUBLESHOOTING.md 第 54 条。
# 现在这条信息记在 /etc/default/edgevision 的注释里，不再放这里。

[Service]
# 故意为空：不覆盖 ExecStart，让 $GATEWAY_CAM 生效。
# systemd 对同一指令是"追加"语义，这里不写 ExecStart= 就不会多出一个实例。
